name: Compilar APK - Rellenador Android
on:
  workflow_dispatch:
  push:
    branches: [desarrollo]
    paths:
      - "android/capturador/**"
      - "shared/**"
      - ".github/workflows/build-android-capturador.yml"
permissions:
  contents: read
jobs:
  build-capturador:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Restaurar caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            android/capturador/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-capturador-${{ hashFiles('android/capturador/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-capturador-
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libltdl-dev libssl-dev
      - name: Preparar herramientas Python
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "setuptools<81" "cython==0.29.34"
          python -m pip install buildozer
      - name: Integrar módulos compartidos del rellenador
        run: |
          rm -rf android/capturador/shared
          cp -R shared android/capturador/shared
      - name: Compilar APK del rellenador
        working-directory: android/capturador
        env:
          P4A_RELEASE_URL: https://github.com/kivy/python-for-android
          P4A_RELEASE_BRANCH: develop
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python --version
          buildozer --version
          yes | buildozer android debug
      - name: Verificar APK
        run: |
          set -e
          APK="$(find android/capturador/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK generado: $APK"
          mkdir -p artifacts/capturador
          cp "$APK" artifacts/capturador/
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-capturador
          path: artifacts/capturador/*.apk
          if-no-files-found: error
