name: Compilar APK - Rellenador Android
on:
  workflow_dispatch:
  push:
    branches: [desarrollo]
    paths:
      - "android/capturador/**"
      - "shared/**"
      - ".github/workflows/build-android-capturador.yml"
permissions:
  contents: read
jobs:
  build-capturador:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Restaurar caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            android/capturador/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-capturador-${{ hashFiles('android/capturador/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-capturador-
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libltdl-dev libssl-dev
      - name: Preparar herramientas Python
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "setuptools<81" "cython==0.29.34"
          python -m pip install buildozer
      - name: Instalar y verificar Android SDK API 34
        shell: bash
        run: |
          set -euo pipefail
          GLOBAL_SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$GLOBAL_SDKMANAGER" ]; then
            echo "No se encontró sdkmanager dentro de $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          # Buildozer busca sdkmanager dentro de su propio SDK; instalar solo las plataformas no basta.
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          GLOBAL_CMDLINE_TOOLS="$(dirname "$(dirname "$GLOBAL_SDKMANAGER")")"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          cp -R "$GLOBAL_CMDLINE_TOOLS" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          test -x "$SDKMANAGER"
          test -d "$SDK_ROOT/platforms/android-34"
          test -x "$SDK_ROOT/build-tools/34.0.0/aapt"
          echo "SDK Manager, Android API 34 y Build Tools 34.0.0 instalados en el SDK que utiliza Buildozer."
      - name: Integrar módulos compartidos del rellenador
        run: |
          rm -rf android/capturador/shared
          cp -R shared android/capturador/shared
      - name: Compilar APK del rellenador
        working-directory: android/capturador
        env:
          P4A_RELEASE_URL: https://github.com/kivy/python-for-android
          P4A_RELEASE_BRANCH: develop
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python --version
          buildozer --version
          yes | buildozer android debug
      - name: Verificar APK
        run: |
          set -e
          APK="$(find android/capturador/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK generado: $APK"
          mkdir -p artifacts/capturador
          cp "$APK" artifacts/capturador/
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-capturador
          path: artifacts/capturador/*.apk
          if-no-files-found: error
