stages:
  - build

build_android:
  stage: build
  image: ubuntu:24.04
  parallel:
    matrix:
      - APP: configurador
      - APP: capturador
  variables:
    DEBIAN_FRONTEND: noninteractive
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    P4A_RELEASE_URL: "https://github.com/kivy/python-for-android"
    P4A_RELEASE_BRANCH: "develop"
    PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  cache:
    key: "buildozer-$APP"
    paths:
      - android/$APP/.buildozer/
      - .cache/pip/
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-pip python3-venv git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
    - python3 -m venv .venv
    - . .venv/bin/activate
    - python -m pip install --upgrade "pip<25"
    - python -m pip install "setuptools<81"
    - python -m pip install "cython==0.29.34"
    - python -m pip install --upgrade buildozer
    - |
      if [ "$APP" = "configurador" ]; then
        SDKMANAGER="$(find "$CI_PROJECT_DIR/android/$APP/.buildozer/android/platform/android-sdk" /root/.buildozer/android/platform/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
        echo "=== BUSCANDO SDKMANAGER ==="
        find "$CI_PROJECT_DIR/android/$APP/.buildozer" /root/.buildozer -type f -name sdkmanager -print 2>/dev/null || true
        if [ -n "$SDKMANAGER" ]; then
          echo "SDKMANAGER encontrado: $SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" || true
        else
          echo "AVISO: no se encontro sdkmanager antes de Buildozer; se continuara para que Buildozer inicialice el SDK."
        fi
      fi
  script:
    - . .venv/bin/activate
    - rm -rf "android/$APP/shared"
    - cp -R shared "android/$APP/shared"
    - rm -rf "android/$APP/bin"
    - cd "android/$APP"
    - python --version
    - python -m pip --version
    - buildozer --version
    - echo "=== INICIANDO COMPILACION DE $APP ==="
    - printf 'y\n' | buildozer android debug > "$CI_PROJECT_DIR/build-$APP.log" 2>&1
    - echo "=== COMPILACION TERMINADA ==="
    - test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
    - ls -lah bin/
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        echo ""
        echo "=============================================="
        echo " DIAGNOSTICO DE LA COMPILACION: $APP"
        echo "=============================================="
        echo ""
        echo "--- ERRORES / EXCEPCIONES DETECTADOS ---"
        grep -Ein "error|failed|exception|traceback|fatal" "$CI_PROJECT_DIR/build-$APP.log" | tail -n 120 || true
        echo ""
        echo "--- ULTIMAS 120 LINEAS DEL LOG ---"
        tail -n 120 "$CI_PROJECT_DIR/build-$APP.log" || true
        echo ""
        echo "El log completo queda guardado como artifact."
      else
        echo ""
        echo "=== APK DE $APP GENERADO CORRECTAMENTE ==="
      fi
  artifacts:
    name: "android-$APP"
    when: always
    paths:
      - android/$APP/bin/*.apk
      - build-$APP.log
    expire_in: 7 days
